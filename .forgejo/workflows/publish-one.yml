name: Publish one CI image

on:
  workflow_dispatch:
    inputs:
      image:
        description: Image to build and publish
        type: choice
        required: true
        default: postgres
        options:
          - base
          - dotnet
          - go
          - node
          - odin
          - openjdk
          - postgres
          - railway
          - rust
          - security

concurrency:
  group: freebsd-image-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: freebsd-15.1-host
    env:
      CONTAINER_TOOL: /usr/local/bin/ci-podman
      REGISTRY_TOOL: /usr/local/bin/ci-skopeo
      CONFIRMED_PKG_QUARTER: ${{ vars.CONFIRMED_PKG_QUARTER }}
    steps:
      - name: Checkout
        shell: sh
        env:
          CHECKOUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git init
          auth=$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')
          git -c "http.extraHeader=Authorization: Basic $auth" fetch --depth=1 \
            "https://git.9dev.tech/$REPOSITORY.git" "$COMMIT"
          git checkout --force --detach FETCH_HEAD
          git clean -ffd
      - name: Check privileged container tools
        shell: sh
        run: gmake check-tools
      - name: Log in
        shell: sh
        env:
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/ci-registry-auth.json
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: gmake login
      - name: Build and publish selected image
        shell: sh
        env:
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/ci-registry-auth.json
          IMAGE: ${{ inputs.image }}
        run: |
          set -eu
          case "$IMAGE" in
            base|dotnet|go|node|odin|openjdk|postgres|railway|rust|security) exec gmake "push-$IMAGE" ;;
            *) echo "Unknown image: $IMAGE" >&2; exit 1 ;;
          esac
      - name: Remove registry credentials
        if: always()
        shell: sh
        env:
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/ci-registry-auth.json
        run: rm -f "$REGISTRY_AUTH_FILE"
