name: Test PostgreSQL service from ci-rust
on: workflow_dispatch

jobs:
  smoke:
    runs-on: ci-rust
    services:
      postgres:
        image: git.9dev.tech/9-developers/ci-postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: app_test
    env:
      DATABASE_URL: postgres://ci:ci@postgres:5432/app_test
    steps:
      - name: Query the database over the job network
        shell: sh
        run: |
          set -eu
          pkg install -y postgresql18-client
          export PGCONNECT_TIMEOUT=2
          for attempt in $(jot 30); do
            if [ "$(psql -XAt "$DATABASE_URL" -c 'SELECT 1')" = 1 ]; then
              exit 0
            fi
            sleep 1
          done
          exit 1
