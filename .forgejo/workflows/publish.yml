name: Publish FreeBSD CI images

on:
  workflow_dispatch:
  push:
    tags:
      - 'ci-*/*'

concurrency:
  group: freebsd-image-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: freebsd-image-publish
    env:
      CONTAINER_TOOL: /usr/local/bin/ci-podman
      REGISTRY_TOOL: /usr/local/bin/ci-skopeo
      CONFIRMED_PKG_QUARTER: ${{ vars.CONFIRMED_PKG_QUARTER }}
    steps:
      # Avoid JavaScript actions' platform-specific Node binaries.
      - name: Checkout
        shell: sh
        env:
          CHECKOUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git init
          auth=$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')
          git -c "http.extraHeader=Authorization: Basic $auth" fetch --depth=1 \
            "https://git.9dev.tech/$REPOSITORY.git" "$COMMIT"
          git checkout --force --detach FETCH_HEAD
          case "$REF" in
            refs/tags/*)
              git -c "http.extraHeader=Authorization: Basic $auth" fetch \
                "https://git.9dev.tech/$REPOSITORY.git" refs/heads/main:refs/remotes/publisher/main
              if ! git merge-base --is-ancestor "$COMMIT" refs/remotes/publisher/main; then
                printf '%s\n' 'The release tag must point to a commit on main.' >&2
                exit 1
              fi
              ;;
          esac
          git clean -ffd
      - name: Select release target
        id: release
        shell: sh
        env:
          REF: ${{ github.ref }}
        run: |
          set -eu
          case "$REF" in
            refs/tags/*)
              tag=${REF#refs/tags/ci-}
              image=${tag%%/*}
              case "$image" in
                base|dotnet|go|node|odin|openjdk|postgres|railway|rust|security) ;;
                *) echo "Unknown release image: $image" >&2; exit 1 ;;
              esac
              expected=$(gmake -s "tag-$image")
              test "$tag" = "$image/$expected"
              echo "target=push-$image" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "target=publish" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Check privileged container tools
        shell: sh
        run: gmake check-tools
      - name: Log in
        shell: sh
        env:
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/ci-registry-auth.json
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: gmake login
      - name: Build and publish
        shell: sh
        env:
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/ci-registry-auth.json
          TARGET: ${{ steps.release.outputs.target }}
        run: gmake -j 4 "$TARGET"
      - name: Remove registry credentials
        if: always()
        shell: sh
        env:
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/ci-registry-auth.json
        run: rm -f "$REGISTRY_AUTH_FILE"
